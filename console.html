<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>技能控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #10141d; --surface: #171c28; --raised: #1e2433; --line: rgba(233, 228, 216, .13);
    --text: #e9e4d8; --dim: #9a968c; --accent: #f2c66d; --ok: #7ad6a0; --warn: #ffd27a; --risk: #ff8a7a;
    --sans: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    --serif: "Noto Serif TC", "PMingLiU", serif;
    --mono: "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: rgba(233, 228, 216, .22) transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 var(--sans); }
  body { display: grid; grid-template-rows: auto auto 1fr; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }

  /* 頂列 */
  #bar { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { font: 700 20px/1.2 var(--serif); margin: 0; letter-spacing: .06em; }
  .views { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .views a { padding: 5px 14px; text-decoration: none; color: var(--dim); }
  .views a[aria-current] { background: var(--accent); color: #1a1405; font-weight: 600; }
  .views a:hover:not([aria-current]) { color: var(--text); }
  #q { flex: 1; min-width: 180px; max-width: 460px; padding: 7px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  #q::placeholder { color: var(--dim); }
  #live { margin-left: auto; color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 8px; }
  #live i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  #live.on i { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .btn { padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; white-space: nowrap; text-decoration: none; display: inline-block; }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: progress; }
  .btn.danger:hover:not(:disabled) { border-color: var(--risk); color: var(--risk); }

  /* 狀態分段：同時是篩選器 */
  #segs { display: flex; gap: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  #segs button { padding: 10px 20px 9px; border-right: 1px solid var(--line); border-bottom: 2px solid transparent; white-space: nowrap; color: var(--dim); }
  #segs b { display: block; font: 500 22px/1.15 var(--sans); color: var(--text); font-variant-numeric: tabular-nums; }
  #segs button:hover { background: var(--surface); }
  #segs button[aria-pressed="true"] { border-bottom-color: var(--accent); background: var(--surface); color: var(--text); }
  #segs button.warn b { color: var(--warn); }

  /* 主體三欄 */
  main { display: grid; grid-template-columns: auto minmax(0, 1fr) 360px; min-height: 0; }
  main > * { min-height: 0; overflow: auto; }
  #left { border-right: 1px solid var(--line); padding: 16px 16px 24px 20px; }
  #right { border-left: 1px solid var(--line); padding: 20px; background: var(--surface); }
  h2 { font: 500 13px var(--sans); color: var(--dim); margin: 0 0 10px; letter-spacing: .08em; }

  /* 能力矩陣：來源 × 主題，格子深淺 = 技能數，點擊即篩選 */
  #matrix { border-collapse: separate; border-spacing: 2px; }
  #matrix th { font-weight: 400; padding: 0; }
  #matrix thead th button { writing-mode: vertical-rl; padding: 4px 3px; height: 92px; font-size: 12px; color: var(--dim); border-radius: 4px; }
  #matrix tbody th button { display: flex; align-items: center; gap: 8px; width: 150px; padding: 2px 6px 2px 4px; border-radius: 4px; font-size: 12px; }
  #matrix tbody th span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #matrix tbody th i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  #matrix tbody th small { color: var(--dim); font-variant-numeric: tabular-nums; }
  #matrix th button:hover, #matrix th button[aria-pressed="true"] { background: var(--raised); color: var(--text); }
  #matrix th button[aria-pressed="true"] { box-shadow: inset 0 0 0 1px var(--accent); }
  #matrix td { padding: 0; }
  #matrix td button { width: 24px; height: 22px; border-radius: 3px; text-align: center; font-size: 10px; font-variant-numeric: tabular-nums;
    background: color-mix(in srgb, var(--accent) calc(var(--v) * 78%), var(--raised)); color: color-mix(in srgb, #1a1405 calc(var(--v) * 100%), var(--dim)); }
  #matrix td button:disabled { background: transparent; box-shadow: inset 0 0 0 1px rgba(233, 228, 216, .06); cursor: default; }
  #matrix td button:hover:not(:disabled), #matrix td button[aria-pressed="true"] { outline: 2px solid var(--text); outline-offset: -1px; }
  #top { list-style: none; margin: 0; padding: 0; }
  #top button { display: flex; gap: 10px; width: 100%; padding: 4px 6px; border-radius: 4px; font-size: 13px; }
  #top button:hover { background: var(--raised); }
  #top span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #top small { color: var(--dim); font-variant-numeric: tabular-nums; }

  /* 清單 */
  #mid { display: flex; flex-direction: column; }
  #meta { padding: 10px 16px; color: var(--dim); font-size: 12px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--line); flex: none; }
  #wrap { overflow: auto; flex: 1; }
  #grid { width: 100%; border-collapse: collapse; font-size: 13px; }
  #grid th { position: sticky; top: 0; background: var(--bg); text-align: left; font-weight: 400; color: var(--dim); border-bottom: 1px solid var(--line); padding: 0; white-space: nowrap; z-index: 1; }
  #grid th button { padding: 8px 12px; width: 100%; }
  #grid th button:hover { color: var(--text); }
  #grid th[aria-sort] button { color: var(--accent); }
  #grid td { padding: 6px 12px; border-bottom: 1px solid rgba(233, 228, 216, .06); white-space: nowrap; }
  #grid td.r, #grid th.r button { text-align: right; }
  #grid tr[aria-selected="true"] td { background: var(--raised); }
  #grid tbody tr:hover td { background: var(--surface); }
  #grid td:first-child { max-width: 300px; }
  #grid .name { display: flex; align-items: center; gap: 8px; width: 100%; }
  #grid .name i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  #grid .name span { overflow: hidden; text-overflow: ellipsis; }
  #grid tr.ghost .name i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
  #grid tr.ghost td { color: var(--dim); }
  #grid .src { max-width: 150px; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--dim); margin-right: 4px; }
  .tag.own { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .tag.todo { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }

  /* 指令 */
  .cmds { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .cmd { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .cmd .zh { grid-column: 1 / -1; }
  .cmd code { font: 12px/1.6 var(--mono); color: var(--accent); overflow-wrap: anywhere; white-space: pre-wrap; }
  .cmd small { grid-column: 1 / -1; color: var(--dim); font-size: 11px; }
  .cmd .copy { font-size: 12px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--dim); }
  .cmd .copy:hover { color: var(--accent); border-color: var(--accent); }
  #cmdview { padding: 4px 16px 24px; max-width: 880px; }
  #cmdview h3 { margin: 18px 0 8px; font: 500 14px var(--sans); }
  #cmdview h3 button { display: inline-flex; align-items: center; gap: 8px; padding: 2px 6px; border-radius: 4px; }
  #cmdview h3 button:hover { background: var(--raised); }
  #cmdview h3 i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  #cmdview h3 small { color: var(--dim); font-weight: 400; }
  #view { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-left: auto; }
  #view button { padding: 4px 12px; color: var(--dim); }
  #view button[aria-pressed="true"] { background: var(--raised); color: var(--text); }
  #i-cmds h4 { margin: 16px 0 6px; font: 400 12px var(--sans); color: var(--dim); }
  #empty { padding: 40px 16px; color: var(--dim); }

  /* 檢視面板 */
  #right h3 { font: 700 20px/1.3 var(--serif); margin: 8px 0 2px; overflow-wrap: anywhere; }
  #right .sub { color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #right .sub i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  #right p { margin: 14px 0; overflow-wrap: anywhere; }
  #i-orig { color: var(--dim); font-size: 12px; margin-top: -6px !important; }
  #i-orig:empty, #i-topics:empty { display: none; }
  #i-rel h4 { margin: 14px 0 2px; font: 400 12px var(--sans); color: var(--dim); }
  #i-rel button { display: flex; gap: 8px; align-items: baseline; width: 100%; padding: 3px 6px; border-radius: 4px; }
  #i-rel button:hover { background: var(--raised); }
  #i-rel i { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  #i-rel span { overflow-wrap: anywhere; flex: 1; }
  #i-rel small { color: var(--dim); white-space: nowrap; }
  #right dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 16px 0 0; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; }
  #right dt { color: var(--dim); }
  #right dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  #i-path { font-family: var(--mono); }
  #i-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  #i-scan { margin-top: 14px; font-size: 12px; }
  #i-scan strong { display: block; font-size: 14px; }
  #i-scan ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
  #i-scan li { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; overflow-wrap: anywhere; }
  #i-scan li small { display: block; color: var(--dim); font-family: var(--mono); }
  #i-close { float: right; width: 30px; height: 30px; border-radius: 50%; text-align: center; font-size: 18px; color: var(--dim); }
  #i-close:hover { background: var(--raised); color: var(--text); }
  #idle { color: var(--dim); }
  #idle kbd { font: 12px var(--mono); padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; }
  #error { padding: 40px 20px; }

  @media (max-width: 1180px) {
    main { grid-template-columns: minmax(0, 1fr) 340px; }
    #left { grid-column: 1 / -1; border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 32px; overflow-x: auto; }
    #top { min-width: 220px; }
    body { grid-template-rows: auto auto auto; height: auto; }
    main > * { overflow: visible; } #wrap { overflow-x: auto; }
    #grid th { top: 0; position: static; }
  }
  @media (max-width: 760px) {
    #bar, #left { padding-left: 16px; padding-right: 16px; }
    main { grid-template-columns: minmax(0, 1fr); }
    #left { flex-direction: column; gap: 20px; }
    #right { position: fixed; inset: 0; z-index: 5; overflow: auto; border: 0; }
    #right.idle { display: none; }
    #grid .opt { display: none; }
    #segs button { padding: 8px 14px; }
    #live span { display: none; }
  }
  @media (prefers-reduced-motion: no-preference) { #grid tr td, #matrix button { transition: background .12s; } }
</style>
</head>
<body>

<header id="bar">
  <h1>技能控制台</h1>
  <nav class="views" aria-label="切換檢視"><a href="index.html">星圖</a><a href="console.html" aria-current="page">控制台</a><a href="mcp.html">MCP</a></nav>
  <input id="q" type="search" placeholder="搜尋名稱、描述或來源（按 / 聚焦）" aria-label="搜尋技能" autocomplete="off">
  <span id="manage" hidden>
    <a class="btn" href="index.html#dlg=manual">新增技能</a>
    <a class="btn" href="index.html#dlg=check">檢查更新</a>
    <a class="btn" href="index.html#dlg=inspect">安全掃描</a>
  </span>
  <div id="live"><i></i><span></span></div>
</header>

<div id="segs" role="group" aria-label="依狀態篩選"></div>

<main>
  <aside id="left">
    <section>
      <h2>能力矩陣（來源 × 主題）</h2>
      <table id="matrix"><thead></thead><tbody></tbody></table>
    </section>
    <section>
      <h2 style="margin-top:20px">最常被其他技能引用</h2>
      <ol id="top"></ol>
    </section>
  </aside>

  <section id="mid" aria-label="技能清單">
    <div id="meta"><span id="count" aria-live="polite"></span><button class="btn" id="reset" hidden>清除篩選</button><div id="view" role="group" aria-label="切換清單內容"><button data-v="skills">技能</button><button data-v="cmds">指令</button></div></div>
    <div id="wrap">
      <table id="grid">
        <thead><tr></tr></thead>
        <tbody></tbody>
      </table>
      <div id="cmdview" hidden></div>
      <div id="empty" hidden>沒有符合的項目。清除篩選或換個關鍵字。</div>
    </div>
  </section>

  <aside id="right" class="idle" aria-live="polite">
    <div id="idle">
      <p>從清單選一個技能，這裡會顯示描述、關聯與可執行的動作。</p>
      <p><kbd>/</kbd> 搜尋　<kbd>↑</kbd><kbd>↓</kbd> 移動　<kbd>Esc</kbd> 取消選取</p>
    </div>
    <div id="insp" hidden>
      <button id="i-close" aria-label="關閉">×</button>
      <div class="sub"><i id="i-dot"></i><span id="i-source"></span><span class="tag" id="i-owned"></span></div>
      <h3 id="i-name"></h3>
      <div class="sub" id="i-group"></div>
      <p id="i-desc"></p>
      <p id="i-orig" lang="en"></p>
      <div id="i-topics"></div>
      <div id="i-cmds"></div>
      <div id="i-rel"></div>
      <dl>
        <dt>路徑</dt><dd id="i-path"></dd>
        <dt>行數</dt><dd id="i-lines"></dd>
        <dt>大小</dt><dd id="i-bytes"></dd>
        <dt>修改</dt><dd id="i-mod"></dd>
      </dl>
      <div id="i-actions">
        <button class="btn" id="a-copy">複製路徑</button>
        <a class="btn" id="a-map">在星圖中查看</a>
        <button class="btn" id="a-scan" hidden>安全掃描</button>
        <button class="btn danger" id="a-remove" hidden>移到回收資料夾</button>
      </div>
      <div id="i-scan" aria-live="polite"></div>
    </div>
  </aside>
</main>

<script src="skills-data.js"></script>
<script type="module">
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
// 與 index.html 相同的載入方式：有管理伺服器就即時掃描，否則用靜態的 skills-data.js（唯讀）
const apiFetch = async (url, body) => {
  const r = await fetch(url, body && { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Skills-Galaxy': '1' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: '伺服器回應格式錯誤' }));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const DATA = await apiFetch('/api/skills').catch(() => null) ?? window.SKILLS_DATA;
if (!DATA) {
  document.querySelector('main').replaceWith(el('div', { id: 'error', textContent: '沒有資料：請執行 node server.mjs，或先跑 node scan.mjs 產生 skills-data.js。' }));
  throw new Error('no data');
}
const { skills, generatedAt, links = [], missing = [], manage = false, trash = 0 } = DATA;
const GHOST = '未安裝（被引用）', installed = skills.length;
for (const m of missing) {
  for (const r of m.refs) links.push([r, skills.length, 'need']);
  skills.push({ name: m.name, source: GHOST, ghost: true, hint: m.hint, description: '', group: '', topics: [], path: '', lines: 0, bytes: 0, modified: '', commands: [] });
}
// 來源配色必須與 index.html 一致（同一份色盤、同樣依技能數排序），兩個檢視的顏色才對得上
const PALETTE = ['#f2c66d', '#6fd3ff', '#ff8fa3', '#9be28a', '#c9a0ff', '#ff9d5c', '#5ee6c8', '#f4f1a0', '#8fb0ff', '#ff7fd1',
  '#b8e06a', '#ffb3a0', '#7ee0f0', '#d9b38c', '#a7f0b5', '#e6a8ff', '#ffd98a', '#9ad0c2', '#f7a6c1'];
const bySource = new Map();
skills.forEach((s, i) => { s.i = i; s.refIn = 0; s.refOut = 0; (bySource.get(s.source) ?? bySource.set(s.source, []).get(s.source)).push(s); });
const sources = [...bySource.entries()].sort((a, b) => b[1].length - a[1].length)
  .map(([name, items], k) => ({ name, items, color: name === GHOST ? '#9aa0b0' : PALETTE[k % PALETTE.length] }));
for (const src of sources) for (const s of src.items) s.color = src.color;
for (const [a, b, t] of links) if (t === 'ref' || t === 'need') { skills[a].refOut++; skills[b].refIn++; }
for (const s of skills) s.todo = !s.ghost && !s.descriptionZh && !!s.description && !/[一-鿿]/.test(s.description);
const topicCount = new Map();
for (const s of skills) for (const t of s.topics) topicCount.set(t, (topicCount.get(t) ?? 0) + 1);
const topics = [...topicCount.keys()].sort((a, b) => topicCount.get(b) - topicCount.get(a));

// ── 篩選狀態 ──────────────────────────────────────────────
const SEGS = [
  ['all', '全部技能', (s) => !s.ghost],
  ['owned', '使用者自有', (s) => s.owned],
  ['plugin', '外掛管理', (s) => !s.ghost && !s.owned],
  ['ghost', '被引用但未安裝', (s) => s.ghost],
  ['todo', '尚無中文描述', (s) => s.todo, 'warn'],
  ['solo', '沒有引用關係', (s) => !s.ghost && !s.refIn && !s.refOut],
];
const f = { seg: 'all', source: null, topic: null, q: '', sort: 'name', dir: 1, view: 'skills' };
let selected = null, rows = [];

const COLS = [
  ['name', '名稱', (s) => s.name.toLowerCase()],
  ['source', '來源', (s) => s.source, 'opt'],
  ['topics', '主題', (s) => s.topics.join(), 'opt'],
  ['cmds', '指令', (s) => s.commands.length, 'r'],
  ['refIn', '被引用', (s) => s.refIn, 'r'],
  ['refOut', '引用', (s) => s.refOut, 'r opt'],
  ['lines', '行數', (s) => s.lines, 'r opt'],
  ['bytes', '大小', (s) => s.bytes, 'r opt'],
  ['modified', '修改', (s) => s.modified, 'opt'],
];
const kb = (n) => (n ? `${(n / 1024).toFixed(1)} KB` : '—');
// 呼叫方式：自有技能是 /名稱，外掛技能要加上外掛名稱
const invoke = (s) => `/${s.owned ? '' : s.source + ':'}${s.name}`;
const copyBtn = (text) => {
  const b = el('button', { className: 'copy', textContent: '複製' }); b.setAttribute('aria-label', `複製指令 ${text}`);
  b.onclick = () => navigator.clipboard.writeText(text).then(() => { b.textContent = '已複製'; setTimeout(() => { b.textContent = '複製'; }, 1200); });
  return b;
};
// 一條指令：中文說明在上、指令在下；有譯文時把原文說明縮小附在最後
const cmdItem = (cmd, zh, note) => el('li', { className: 'cmd' }, el('div', { className: 'zh', textContent: zh || note || '原文沒有附說明' }),
  el('code', { textContent: cmd }), copyBtn(cmd), ...(zh && note ? [el('small', { textContent: note, lang: 'en' })] : []));

function render() {
  const q = f.q.toLowerCase(), seg = SEGS.find(([k]) => k === f.seg)[2];
  const col = COLS.find(([k]) => k === f.sort)[2];
  rows = skills.filter((s) => seg(s) && (!f.source || s.source === f.source) && (!f.topic || s.topics.includes(f.topic))
    && (!q || `${s.name} ${s.description} ${s.descriptionZh ?? ''} ${s.source} ${s.group} ${f.view === 'cmds' ? s.commands.map((c) => `${c.cmd} ${c.zh ?? ''} ${c.note}`).join(' ') : ''}`.toLowerCase().includes(q)))
    .sort((a, b) => { const x = col(a), y = col(b); return (x < y ? -1 : x > y ? 1 : a.name.localeCompare(b.name)) * f.dir; });

  $('grid').tBodies[0].replaceChildren(...rows.map((s) => {
    const name = el('button', { className: 'name', title: s.descriptionZh || s.description || s.name }, el('i'), el('span', { textContent: s.name }));
    name.style.setProperty('--c', s.color); name.onclick = () => select(s);
    const tr = el('tr', { className: s.ghost ? 'ghost' : '' },
      el('td', {}, name),
      el('td', { className: 'src opt', textContent: s.source }),
      el('td', { className: 'opt' }, ...s.topics.map((t) => el('span', { className: 'tag', textContent: t })), ...(s.todo ? [el('span', { className: 'tag todo', textContent: '待翻譯' })] : [])),
      el('td', { className: 'r num', textContent: s.commands.length || '' }),
      el('td', { className: 'r num', textContent: s.refIn || '' }),
      el('td', { className: 'r num opt', textContent: s.refOut || '' }),
      el('td', { className: 'r num opt', textContent: s.lines || '' }),
      el('td', { className: 'r num opt', textContent: s.ghost ? '' : kb(s.bytes) }),
      el('td', { className: 'num opt', textContent: s.modified }));
    tr.setAttribute('aria-selected', String(s === selected)); s.tr = tr; return tr;
  }));
  // 指令檢視：依技能分組列出指令。同名技能（多個來源）的指令相同，只列一次
  const cmdMode = f.view === 'cmds', groups = cmdMode ? [...new Map(rows.filter((s) => s.commands.length).map((s) => [s.name, s])).values()] : [];
  $('grid').hidden = cmdMode; $('cmdview').hidden = !cmdMode;
  let shownCmds = 0;
  $('cmdview').replaceChildren(...groups.flatMap((s) => {
    const nameHit = !q || `${s.name} ${s.source}`.toLowerCase().includes(q);
    const list = s.commands.filter((c) => nameHit || `${c.cmd} ${c.zh ?? ''} ${c.note}`.toLowerCase().includes(q));
    if (!list.length) return [];
    shownCmds += list.length;
    const b = el('button', {}, el('i'), s.name, el('small', { textContent: `${s.source}・${list.length} 條` }));
    b.style.setProperty('--c', s.color); b.onclick = () => select(s);
    return [el('h3', {}, b), el('ul', { className: 'cmds' }, ...list.map((c) => cmdItem(c.cmd, c.zh, c.note)))];
  }));
  for (const b of $('view').children) b.setAttribute('aria-pressed', String(b.dataset.v === f.view));
  $('empty').hidden = cmdMode ? !!shownCmds : !!rows.length;
  const filtered = f.seg !== 'all' || f.source || f.topic || f.q;
  $('count').textContent = (cmdMode ? `顯示 ${shownCmds} 條指令，來自 ${$('cmdview').querySelectorAll('h3').length} 個技能` : `顯示 ${rows.length} 個`) + [f.source, f.topic, f.q && `「${f.q}」`].filter(Boolean).map((x) => `　${x}`).join('');
  $('reset').hidden = !filtered;
  for (const b of $('segs').children) b.setAttribute('aria-pressed', String(b.dataset.k === f.seg));
  for (const th of $('grid').tHead.rows[0].cells) th.dataset.k === f.sort ? th.setAttribute('aria-sort', f.dir > 0 ? 'ascending' : 'descending') : th.removeAttribute('aria-sort');
  for (const b of $('matrix').querySelectorAll('button')) {
    const { source, topic } = b.dataset;
    b.setAttribute('aria-pressed', String((source ?? null) === f.source && (topic ?? null) === f.topic && !!(f.source || f.topic)));
  }
}

function select(s) {
  if (selected?.tr) selected.tr.setAttribute('aria-selected', 'false');
  selected = s;
  $('right').classList.toggle('idle', !s); $('idle').hidden = !!s; $('insp').hidden = !s;
  if (!s) return;
  s.tr?.setAttribute('aria-selected', 'true'); s.tr?.scrollIntoView({ block: 'nearest' });
  $('i-dot').style.setProperty('--c', s.color); $('i-source').textContent = s.source;
  $('i-owned').textContent = s.ghost ? '由引用推測' : s.owned ? '使用者自有' : '外掛管理，更新時會被覆蓋';
  $('i-owned').className = `tag${s.owned ? ' own' : ''}`;
  $('i-name').textContent = s.name; $('i-group').textContent = s.group || (s.hint ? `可能來自 ${s.hint}` : '');
  $('i-desc').textContent = s.ghost ? '其他技能的說明裡提到了它，但本機沒有安裝。' : s.descriptionZh || s.description || '這個技能沒有寫描述。';
  $('i-orig').textContent = s.descriptionZh ? `原文：${s.description}` : '';
  $('i-topics').replaceChildren(...s.topics.map((t) => el('span', { className: 'tag', textContent: t })));
  $('i-cmds').replaceChildren(...(s.ghost ? [] : [el('h4', { textContent: '呼叫方式' }),
    el('ul', { className: 'cmds' }, cmdItem(invoke(s), '在 Claude Code 輸入這個斜線指令來啟用技能；Claude 判斷任務相符時也會自動使用。')),
    ...(s.commands.length ? [el('h4', { textContent: `技能內的指令 ${s.commands.length}` }), el('ul', { className: 'cmds' }, ...s.commands.map((c) => cmdItem(c.cmd, c.zh, c.note)))] : [])]));
  // 關聯：依類型與方向分組
  const groups = [['引用了', (a, b, t) => a === s.i && (t === 'ref' || t === 'need') && b], ['被這些技能引用', (a, b, t) => b === s.i && (t === 'ref' || t === 'need') && a],
    ['同名（其他來源）', (a, b, t) => t === 'same' && (a === s.i ? b : b === s.i && a)], ['相近', (a, b, t) => t === 'sim' && (a === s.i ? b : b === s.i && a)]];
  $('i-rel').replaceChildren(...groups.flatMap(([label, pick]) => {
    const others = links.map(([a, b, t]) => pick(a, b, t)).filter((x) => x !== false && x !== undefined).map((i) => skills[i]);
    if (!others.length) return [];
    return [el('h4', { textContent: `${label} ${others.length}` }), ...others.map((o) => {
      const b = el('button', {}, el('i'), el('span', { textContent: o.name }), el('small', { textContent: o.source }));
      b.style.setProperty('--c', o.color); b.onclick = () => { if (!rows.includes(o)) reset(o.ghost ? 'ghost' : 'all'); select(o); };
      return b;
    })];
  }));
  $('i-path').textContent = s.path || '—'; $('i-lines').textContent = s.lines || '—'; $('i-bytes').textContent = kb(s.bytes); $('i-mod').textContent = s.modified || '—';
  $('a-copy').hidden = !!s.ghost;
  $('a-map').href = `index.html#${new URLSearchParams({ skill: s.name, source: s.source })}`;
  $('a-scan').hidden = !(manage && !s.ghost); $('a-remove').hidden = !(manage && s.removable);
  $('i-scan').replaceChildren();
}
const reset = (seg = 'all') => { Object.assign(f, { seg, source: null, topic: null, q: '' }); $('q').value = ''; render(); };

// ── 初始化 ────────────────────────────────────────────────
$('live').classList.toggle('on', manage);
$('live').lastElementChild.textContent = manage ? '即時掃描' : `唯讀・掃描於 ${generatedAt.slice(0, 10)}`;
$('manage').hidden = !manage;
if (manage && trash) $('manage').append(el('a', { className: 'btn', href: 'index.html#dlg=trash', textContent: `回收資料夾 (${trash})` }));

$('segs').replaceChildren(...SEGS.map(([k, label, test, cls]) => {
  const n = skills.filter(test).length;
  const b = el('button', { className: cls && n ? cls : '' }, el('b', { textContent: n }), label);
  b.dataset.k = k; b.onclick = () => { f.seg = k; render(); }; return b;
}));

$('grid').tHead.rows[0].replaceChildren(...COLS.map(([k, label, , cls = '']) => {
  const b = el('button', { textContent: label });
  b.onclick = () => { f.dir = f.sort === k ? -f.dir : (typeof COLS.find(([c]) => c === k)[2](skills[0]) === 'number' ? -1 : 1); f.sort = k; render(); };
  const th = el('th', { className: cls }, b); th.dataset.k = k; return th;
}));

// 矩陣：只列有主題標記的已安裝來源；深淺以全表最大格為基準
const cell = (src, t) => src.items.filter((s) => s.topics.includes(t)).length;
const mSources = sources.filter((src) => src.name !== GHOST);
const peak = Math.max(1, ...mSources.flatMap((src) => topics.map((t) => cell(src, t))));
const pick = (source, topic) => () => { const same = f.source === source && f.topic === topic; f.source = same ? null : source; f.topic = same ? null : topic; if (f.seg === 'ghost') f.seg = 'all'; render(); };
$('matrix').tHead.replaceChildren(el('tr', {}, el('th'), ...topics.map((t) => {
  const b = el('button', { textContent: t, title: `${t}：${topicCount.get(t)} 個技能` }); b.dataset.topic = t; b.onclick = pick(null, t); return el('th', { scope: 'col' }, b);
})));
$('matrix').tBodies[0].replaceChildren(...mSources.map((src) => {
  const head = el('button', { title: src.name }, el('i'), el('span', { textContent: src.name }), el('small', { textContent: src.items.length }));
  head.style.setProperty('--c', src.color); head.dataset.source = src.name; head.onclick = pick(src.name, null);
  return el('tr', {}, el('th', { scope: 'row' }, head), ...topics.map((t) => {
    const n = cell(src, t), b = el('button', { textContent: n || '', disabled: !n });
    b.setAttribute('aria-label', `${src.name}・${t}：${n} 個`); b.title = `${src.name}・${t}：${n} 個`;
    b.style.setProperty('--v', (n ? .25 + .75 * n / peak : 0).toFixed(2)); b.dataset.source = src.name; b.dataset.topic = t; b.onclick = pick(src.name, t);
    return el('td', {}, b);
  }));
}));

$('top').replaceChildren(...skills.filter((s) => s.refIn).sort((a, b) => b.refIn - a.refIn).slice(0, 8).map((s) => {
  const b = el('button', {}, el('span', { textContent: s.name }), el('small', { textContent: `${s.refIn} 次${s.ghost ? '・未安裝' : ''}` }));
  b.onclick = () => { if (!rows.includes(s)) reset(s.ghost ? 'ghost' : 'all'); select(s); };
  return el('li', {}, b);
}));

$('q').oninput = (e) => { f.q = e.target.value.trim(); render(); };
$('reset').onclick = () => reset();
for (const b of $('view').children) b.onclick = () => { f.view = b.dataset.v; render(); };
$('i-close').onclick = () => select(null);
$('a-copy').onclick = (e) => navigator.clipboard.writeText(selected.path).then(() => { e.target.textContent = '已複製'; setTimeout(() => { e.target.textContent = '複製路徑'; }, 1200); });
$('a-scan').onclick = async (e) => {
  const s = selected; e.target.disabled = true; $('i-scan').textContent = 'SkillSpector 掃描中，約 10 秒到 1 分鐘…';
  try {
    const [r] = (await apiFetch('/api/inspect', { path: s.path })).reports;
    if (selected !== s) return;
    $('i-scan').replaceChildren(el('strong', { textContent: `${r.score ?? '?'}/100　${r.severity}　${r.recommendation}` }),
      `發現 ${r.total} 項${r.coverage == null ? '' : `，檢查涵蓋率 ${r.coverage}%`}。分數只是風險指標，請對照原始檔判斷。`,
      el('ul', {}, ...r.issues.slice(0, 8).map((i) => el('li', {}, `${i.severity}　${i.id} ${i.pattern}`, el('small', { textContent: `${i.file}${i.line ? ':' + i.line : ''}` })))));
  } catch (err) { if (selected === s) $('i-scan').textContent = `掃描失敗：${err.message}`; } finally { e.target.disabled = false; }
};
$('a-remove').onclick = (e) => {
  if (!confirm(`要把「${selected.name}」移到回收資料夾嗎？之後可以從星圖的「回收資料夾」還原。`)) return;
  e.target.disabled = true;
  apiFetch('/api/remove', { path: selected.path }).then(() => location.reload(), (err) => { e.target.disabled = false; alert(err.message); });
};
addEventListener('keydown', (e) => {
  const typing = !!e.target.matches?.('input, textarea');
  if (e.key === '/' && !typing) { e.preventDefault(); $('q').focus(); }
  else if (e.key === 'Escape') { typing ? e.target.blur() : select(null); }
  else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !typing && rows.length) {
    e.preventDefault();
    const i = rows.indexOf(selected) + (e.key === 'ArrowDown' ? 1 : -1);
    select(rows[Math.max(0, Math.min(rows.length - 1, i))]);
  }
});
render();
</script>
</body>
</html>
